<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jebley Barber Systém</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#b9925f',
                            gray: '#90908f',
                            dark: '#150d07',
                            brown: '#46342b',
                            light: '#f4ece4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(21, 13, 7, 0.05)',
                        'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background-color: #f4ece4; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        /* Skrytí posuvníků pro čistší vzhled */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #90908f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b9925f; }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Dekorativní bloby na pozadí pro glassmorphism efekt */
        .bg-blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; border-radius: 50%; background: #b9925f; opacity: 0.15; filter: blur(100px); z-index: -1; pointer-events: none; }
        .bg-blob-2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vw; border-radius: 50%; background: #46342b; opacity: 0.1; filter: blur(120px); z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="text-brand-dark antialiased selection:bg-brand-gold selection:text-white">
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBf8IfMax0l5uvl9VdertYcK5ruVPBSvuE",
            authDomain: "barber-tabulky.firebaseapp.com",
            projectId: "barber-tabulky",
            storageBucket: "barber-tabulky.firebasestorage.app",
            messagingSenderId: "165152546039",
            appId: "1:165152546039:web:19b8a86e8e215c883cc7f2",
            measurementId: "G-PQ32GEK6QV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Hesla zakódovaná v Base64
        const PASSWORDS = {
            'Admin (Majitel)': 'Wm1yemxpbmE2OQ==', // Zmrzlina69
            'Kadeřník 1': 'QmFyYmVyMDE=',         // Barber01
            'Kadeřník 2': 'QmFyYmVyMDI=',         // Barber02
            'Účetní': 'VWN0bzEyMzQ='              // Ucto1234
        };

        const SERVICES = [
            { name: 'Klasický střih', price: 520 },
            { name: 'Střih strojkem', price: 470 },
            { name: 'Klasický střih a úprava vousů hot towel', price: 995 },
            { name: 'Klasický střih a úprava vousů strojkem', price: 950 },
            { name: 'Úprava vousů metodou hot towel', price: 490 },
            { name: 'Úprava vousů pouze strojkem', price: 460 },
            { name: 'Střih junior (do 8 let)', price: 420 },
            { name: 'Tradiční holení', price: 520 },
            { name: 'Holení hlavy', price: 520 },
            { name: 'Střih dlouhých vlasů', price: 895 },
            { name: 'Střih strojkem a úprava vousů strojkem', price: 900 },
            { name: 'Střih strojkem a úprava vousů hot towel', price: 965 },
            { name: 'Depilace chloupků z nosu a uší', price: 100 },
            { name: 'Barvení vousů', price: 550 },
            { name: 'Černá maska', price: 150 },
            { name: 'Barvení kontur', price: 300 },
            { name: 'Kompletní úprava', price: 1695 }
        ];

        const PAYMENTS = ['HOTOVOST', 'QR', 'POUKAZ'];
        const ROLES = ['Admin (Majitel)', 'Kadeřník 1', 'Kadeřník 2', 'Účetní'];

        // --- STREAMING_CHUNK:Defining Helper Functions ---
        // Funkce pro zaokrouhlení času
        const getDefaultDateTime = () => {
            const now = new Date();
            const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const roundedMinutes = Math.floor(now.getMinutes() / 15) * 15;
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(roundedMinutes).padStart(2, '0')}`;
            return { date, time };
        };

        function App() {
            const [user, setUser] = useState(null);
            const [records, setRecords] = useState([]);
            const [settings, setSettings] = useState({});
            const [activeRole, setActiveRole] = useState('');
            
            const today = new Date();
            const currentMonthStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const [selectedMonth, setSelectedMonth] = useState(currentMonthStr);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formError, setFormError] = useState('');
            const [deleteConfirmId, setDeleteConfirmId] = useState(null); // Custom confirm místo alert()
            
            const initialDT = getDefaultDateTime();
            const [formData, setFormData] = useState({
                date: initialDT.date, time: initialDT.time, service: SERVICES[0].name, price: SERVICES[0].price, 
                payment: PAYMENTS[0], voucherCode: '', notes: '', barber: 'Kadeřník 1'
            });

            const [isAppUnlocked, setIsAppUnlocked] = useState(false);
            const [selectedLoginRole, setSelectedLoginRole] = useState('Kadeřník 1');
            const [pinInput, setPinInput] = useState('');
            const [loginError, setLoginError] = useState('');

            // --- STREAMING_CHUNK:Setting up Effects and Subscriptions ---
            useEffect(() => {
                signInAnonymously(auth).catch(() => {});
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const recordsRef = collection(db, 'barber_records');
                const unsubRecords = onSnapshot(recordsRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => new Date(`${b.date}T${b.time}`) - new Date(`${a.date}T${a.time}`));
                    setRecords(data);
                });
                const settingsRef = collection(db, 'barber_settings');
                const unsubSettings = onSnapshot(settingsRef, (snapshot) => {
                    const data = {};
                    snapshot.docs.forEach(doc => { data[doc.id] = doc.data(); });
                    setSettings(data);
                });
                return () => { unsubRecords(); unsubSettings(); };
            }, [user]);

            const isBarber = activeRole.includes('Kadeřník');
            const isAdmin = activeRole === 'Admin (Majitel)';
            const isMonthLocked = settings[selectedMonth]?.locked === true;

            const handleEasyLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                if (btoa(pinInput) !== PASSWORDS[selectedLoginRole]) {
                    setLoginError('Nesprávné heslo!'); return;
                }
                setActiveRole(selectedLoginRole);
                setIsAppUnlocked(true);
            };

            // --- STREAMING_CHUNK:Calculating Summaries ---
            const filteredRecords = useMemo(() => {
                return records.filter(record => record.date.substring(0, 7) === selectedMonth);
            }, [records, selectedMonth]);

            const totals = useMemo(() => {
                const result = { total: 0, cash: 0, qr: 0, voucher: 0, count: 0, byBarber: {} };
                filteredRecords.forEach(curr => {
                    const price = Number(curr.price) || 0;
                    const barber = curr.barber || 'Neznámý';
                    
                    result.total += price;
                    result.count += 1;
                    if (curr.payment === 'HOTOVOST') result.cash += price;
                    if (curr.payment === 'QR') result.qr += price;
                    if (curr.payment === 'POUKAZ') result.voucher += price;

                    if (!result.byBarber[barber]) {
                        result.byBarber[barber] = { total: 0, cash: 0, qr: 0, voucher: 0, count: 0 };
                    }
                    result.byBarber[barber].total += price;
                    result.byBarber[barber].count += 1;
                    if (curr.payment === 'HOTOVOST') result.byBarber[barber].cash += price;
                    if (curr.payment === 'QR') result.byBarber[barber].qr += price;
                    if (curr.payment === 'POUKAZ') result.byBarber[barber].voucher += price;
                });
                return result;
            }, [filteredRecords]);

            const handleServiceChange = (e) => {
                const serviceName = e.target.value;
                const service = SERVICES.find(s => s.name === serviceName);
                setFormData({ ...formData, service: serviceName, price: service.price });
            };

            // --- STREAMING_CHUNK:Handling Form Submissions and Deletions ---
            const openModalForNew = () => {
                const dt = getDefaultDateTime();
                setFormData({
                    date: dt.date, time: dt.time, service: SERVICES[0].name, price: SERVICES[0].price, 
                    payment: PAYMENTS[0], voucherCode: '', notes: '', barber: activeRole.includes('Kadeřník') ? activeRole : 'Kadeřník 1'
                });
                setEditingId(null);
                setFormError('');
                setIsModalOpen(true);
            };

            const openEditModal = (record) => {
                setFormData({ ...record, voucherCode: record.voucherCode || '', notes: record.notes || '' });
                setEditingId(record.id);
                setFormError('');
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingId(null);
                setFormError('');
            };

            const handleSaveRecord = async (e) => {
                e.preventDefault();
                setFormError('');
                if (!user) return;

                // Kontrola zamčeného měsíce ve formuláři
                const recordMonth = formData.date.substring(0, 7);
                if (settings[recordMonth]?.locked === true && !isAdmin) {
                    setFormError("Chyba: Zvolený měsíc je uzamčen. Záznam do něj nelze uložit."); 
                    return;
                }

                if (formData.payment === 'POUKAZ' && !formData.voucherCode.trim()) {
                    setFormError("Při platbě poukazem je nutné zadat číslo poukazu!"); 
                    return;
                }
                
                try {
                    if (editingId) {
                        await updateDoc(doc(db, 'barber_records', editingId), { ...formData, updatedBy: activeRole, updatedAt: new Date().toISOString() });
                    } else {
                        await addDoc(collection(db, 'barber_records'), { ...formData, createdAt: new Date().toISOString(), addedBy: activeRole });
                    }
                    setIsModalOpen(false);
                } catch (error) { console.error(error); }
            };

            const executeDelete = async (id) => {
                if (!user) return;
                const recordToDelete = records.find(r => r.id === id);
                if (recordToDelete) {
                    try {
                        // Přesun do koše
                        await addDoc(collection(db, 'deleted_records'), {
                            ...recordToDelete, deletedAt: new Date().toISOString(), deletedBy: activeRole, originalId: id
                        });
                        // Odstranění z aktivních
                        await deleteDoc(doc(db, 'barber_records', id));
                    } catch (error) { console.error("Chyba při mazání:", error); }
                }
                setDeleteConfirmId(null);
            };

            const toggleLockMonth = async () => {
                if (!user || !isAdmin) return;
                await setDoc(doc(db, 'barber_settings', selectedMonth), { locked: !isMonthLocked }, { merge: true });
            };

            const formatDate = (dateString) => {
                if (!dateString) return '';
                const [year, month, day] = dateString.split('-');
                return `${day}.${month}.${year}`;
            };

            // --- STREAMING_CHUNK:Rendering Login Screen ---
            if (!isAppUnlocked) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
                        <div className="max-w-md w-full space-y-8 bg-white/70 backdrop-blur-xl p-8 rounded-[2rem] shadow-glass border border-white/50 animate-fade-in z-10">
                            <div className="text-center flex flex-col items-center">
                                <div className="w-20 h-20 bg-brand-dark rounded-3xl flex items-center justify-center mb-6 shadow-xl transform rotate-3">
                                    <img src="https://jebley-barber.cz/images/logo.png" alt="Jebley Barber" className="h-12 object-contain -rotate-3" />
                                </div>
                                <h2 className="text-3xl font-extrabold text-brand-dark tracking-tight">Vstup do systému</h2>
                                <p className="mt-2 text-brand-gray font-medium">Jebley Barber Salon</p>
                            </div>
                            <form className="mt-8 space-y-6" onSubmit={handleEasyLogin}>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-brand-dark/70 mb-2 ml-1">Kdo se přihlašuje?</label>
                                        <select value={selectedLoginRole} onChange={(e) => { setSelectedLoginRole(e.target.value); setPinInput(''); setLoginError(''); }} className="w-full bg-white/60 border border-white/80 rounded-2xl shadow-sm py-3.5 px-4 focus:ring-2 focus:ring-brand-gold focus:border-transparent text-lg font-semibold text-brand-dark outline-none transition-all appearance-none backdrop-blur-sm">
                                            {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                    </div>
                                    <div className="animate-fade-in">
                                        <label className="block text-sm font-bold text-brand-dark/70 mb-2 ml-1">Heslo</label>
                                        <input type="password" required className="w-full bg-white/60 border border-white/80 rounded-2xl shadow-sm py-3.5 px-4 focus:ring-2 focus:ring-brand-gold focus:border-transparent text-center text-2xl tracking-widest outline-none transition-all backdrop-blur-sm" placeholder="••••••••" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                                    </div>
                                </div>
                                {loginError && <p className="text-red-500 text-sm text-center font-bold bg-red-50/80 backdrop-blur-sm py-3 rounded-xl border border-red-100">{loginError}</p>}
                                <button type="submit" className="w-full flex justify-center py-4 px-4 rounded-2xl text-lg font-bold text-white bg-brand-gold hover:bg-[#a68051] focus:outline-none shadow-xl shadow-brand-gold/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                                    Vstoupit do aplikace
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- STREAMING_CHUNK:Rendering Main Dashboard Layout ---
            return (
                <div className="min-h-screen pb-24 md:pb-12 animate-fade-in relative">
                    <header className="sticky top-0 z-30 bg-white/60 backdrop-blur-xl border-b border-white/40 shadow-sm">
                        <div className="max-w-[1600px] mx-auto px-4 py-3 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-dark p-2 rounded-xl"><img src="https://jebley-barber.cz/images/logo.png" alt="Logo" className="h-6" /></div>
                                <h1 className="text-xl font-extrabold tracking-tight hidden sm:block">Barber Systém</h1>
                            </div>
                            <div className="flex items-center gap-3 bg-white/50 backdrop-blur-md border border-white/60 py-1.5 px-4 rounded-full shadow-sm">
                                <span className="text-xs font-bold text-brand-gray uppercase hidden md:block">Profil:</span>
                                <span className="text-brand-gold font-bold text-sm">{activeRole}</span>
                                <div className="h-4 w-px bg-brand-gray/30 mx-1"></div>
                                <button onClick={() => {setIsAppUnlocked(false); setPinInput('');}} className="text-sm font-semibold text-brand-gray hover:text-brand-dark transition-colors">Odhlásit</button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1600px] mx-auto px-4 mt-6 sm:px-6 lg:px-8 flex flex-col xl:flex-row gap-6">
                        
                        <div className="flex-1 flex flex-col gap-6">
                            
                            {/* Controls */}
                            <div className="bg-white/70 backdrop-blur-xl border border-white/50 p-5 rounded-[2rem] shadow-glass flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div className="flex items-center gap-4 w-full sm:w-auto">
                                    <div className="flex-1 sm:flex-none">
                                        <label className="block text-xs font-bold text-brand-gray uppercase mb-1 ml-1">Měsíc</label>
                                        <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)}
                                            className="w-full sm:w-auto rounded-xl py-2.5 px-4 text-sm font-bold outline-none transition-all bg-white shadow-sm border border-white/80 focus:ring-2 focus:ring-brand-gold" />
                                    </div>
                                    {isAdmin && (
                                        <button onClick={toggleLockMonth} className={`mt-5 px-4 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm flex items-center gap-2 ${isMonthLocked ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                            {isMonthLocked ? '🔒 Zamčeno' : '🔓 Odemčeno'}
                                        </button>
                                    )}
                                </div>
                                
                                {!activeRole.includes('Účetní') && !(isMonthLocked && !isAdmin) && (
                                    <button onClick={openModalForNew} className="hidden md:flex bg-brand-gold text-white px-6 py-3.5 rounded-xl font-bold shadow-xl shadow-brand-gold/30 transition-all hover:bg-[#a68051] hover:-translate-y-0.5 items-center gap-2">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                        Nový zákazník
                                    </button>
                                )}
                            </div>

                            {/* --- STREAMING_CHUNK:Rendering Barber Tables --- */}
                            {isBarber && isMonthLocked && (
                                <div className="bg-red-50/80 backdrop-blur-md text-red-700 p-5 rounded-[2rem] flex items-center gap-5 border border-red-200/50 shadow-glass animate-fade-in">
                                    <div className="text-4xl">🔒</div>
                                    <div>
                                        <h3 className="font-extrabold text-lg tracking-tight">Tento měsíc je uzavřen</h3>
                                        <p className="text-sm font-medium opacity-80 mt-0.5">Záznamy si můžeš prohlížet, ale pro přidání či úpravy kontaktuj majitele.</p>
                                    </div>
                                </div>
                            )}

                            <div className="flex flex-col xl:flex-row gap-6">
                                <div className="flex-1 flex flex-col gap-6">
                                    {['Kadeřník 1', 'Kadeřník 2', 'Admin (Majitel)'].map(barberName => {
                                        const barberRecords = filteredRecords.filter(r => r.barber === barberName);
                                        if (barberRecords.length === 0 && barberName === 'Admin (Majitel)') return null;

                                        const isBarber1 = barberName === 'Kadeřník 1';
                                        const borderColor = isBarber1 ? 'border-t-brand-gold' : 'border-t-brand-brown';
                                        const headerBg = isBarber1 ? 'bg-brand-gold/10' : 'bg-brand-brown/10';
                                        const badgeBg = isBarber1 ? 'bg-brand-gold' : 'bg-brand-brown';

                                        return (
                                            <div key={barberName} className={`bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-glass border-t-4 ${borderColor} border-x border-b border-white/50 overflow-hidden`}>
                                                <div className={`${headerBg} px-6 py-5 border-b border-black/5 flex justify-between items-center`}>
                                                    <h3 className="font-extrabold text-brand-dark text-lg tracking-tight">✂️ {barberName}</h3>
                                                    <span className={`${badgeBg} text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-sm`}>
                                                        {barberRecords.length} služeb
                                                    </span>
                                                </div>
                                                <div className="overflow-x-auto">
                                                    <table className="min-w-full divide-y divide-black/5">
                                                        <thead className="bg-white/50">
                                                            <tr>
                                                                <th className="px-6 py-4 text-left text-xs font-extrabold text-brand-gray uppercase tracking-wider">Datum a Čas</th>
                                                                <th className="px-4 py-4 text-left text-xs font-extrabold text-brand-gray uppercase tracking-wider">Služba</th>
                                                                <th className="px-4 py-4 text-left text-xs font-extrabold text-brand-gray uppercase tracking-wider">Platba</th>
                                                                <th className="px-4 py-4 text-right text-xs font-extrabold text-brand-gray uppercase tracking-wider">Cena</th>
                                                                <th className="px-4 py-4 text-left text-xs font-extrabold text-brand-gray uppercase tracking-wider">Poznámky</th>
                                                                <th className="px-6 py-4 text-right text-xs font-extrabold text-brand-gray uppercase tracking-wider">Akce</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-black/5">
                                                            {barberRecords.length === 0 ? (
                                                                <tr><td colSpan="6" className="px-6 py-12 text-center text-brand-gray font-medium">V tomto měsíci nejsou zatím žádné záznamy.</td></tr>
                                                            ) : (
                                                                barberRecords.map((record) => (
                                                                    <tr key={record.id} className="hover:bg-brand-gold/5 transition-colors group relative">
                                                                        <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-brand-dark">{formatDate(record.date)} <span className="text-brand-gray/80 ml-2 font-medium">{record.time}</span></td>
                                                                        <td className="px-4 py-4 text-sm font-medium text-brand-dark break-words min-w-[200px] leading-snug">{record.service}</td>
                                                                        <td className="px-4 py-4 whitespace-nowrap text-sm">
                                                                            <span className={`px-3 py-1 inline-flex text-xs leading-5 font-extrabold rounded-full ${record.payment === 'HOTOVOST' ? 'bg-red-50 text-red-700 border border-red-100' : ''} ${record.payment === 'KARTA' || record.payment === 'QR' ? 'bg-green-50 text-green-700 border border-green-100' : ''} ${record.payment === 'POUKAZ' ? 'bg-purple-50 text-purple-700 border border-purple-100' : ''}`}>{record.payment}</span>
                                                                        </td>
                                                                        <td className="px-4 py-4 whitespace-nowrap text-sm font-extrabold text-brand-dark text-right text-lg">{record.price} <span className="text-sm opacity-50 font-bold">Kč</span></td>
                                                                        <td className="px-4 py-4 text-sm text-brand-gray break-words min-w-[150px] font-medium">
                                                                            {record.payment === 'POUKAZ' && <span className="inline-block bg-purple-50 border border-purple-200 px-2 py-0.5 rounded text-purple-800 font-bold mb-1">Poukaz: {record.voucherCode}</span>}
                                                                            <div>{record.notes}</div>
                                                                        </td>
                                                                        <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                                            {deleteConfirmId === record.id ? (
                                                                                <div className="flex justify-end gap-2 animate-fade-in">
                                                                                    <button onClick={() => setDeleteConfirmId(null)} className="text-brand-gray hover:text-brand-dark px-2 py-1 text-xs font-bold">Zrušit</button>
                                                                                    <button onClick={() => executeDelete(record.id)} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg shadow-sm font-bold text-xs">Opravdu smazat</button>
                                                                                </div>
                                                                            ) : (
                                                                                <div className="flex justify-end gap-2 opacity-100 xl:opacity-0 xl:group-hover:opacity-100 transition-opacity">
                                                                                    {!isMonthLocked && <button onClick={() => openEditModal(record)} className="text-brand-dark hover:text-white bg-white hover:bg-brand-gold border border-black/10 px-3 py-1.5 rounded-lg transition-colors shadow-sm font-bold text-xs">Upravit</button>}
                                                                                    {isAdmin && (
                                                                                        <button onClick={() => setDeleteConfirmId(record.id)} className="text-red-700 hover:text-white bg-red-50 hover:bg-red-600 border border-red-200 px-3 py-1.5 rounded-lg transition-colors shadow-sm font-bold text-xs">Smazat</button>
                                                                                    )}
                                                                                </div>
                                                                            )}
                                                                        </td>
                                                                    </tr>
                                                                ))
                                                            )}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* --- STREAMING_CHUNK:Rendering Sidebar Stats --- */}
                                <div className="w-full xl:w-[380px] shrink-0">
                                    <div className="bg-brand-dark/90 backdrop-blur-2xl border border-white/10 rounded-[2rem] shadow-glass-dark overflow-hidden sticky top-24 text-white p-6">
                                        <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                                            <h3 className="font-extrabold text-xl tracking-tight">Souhrn měsíce</h3>
                                            <span className="bg-white/10 px-3 py-1 rounded-full text-xs font-bold text-brand-gold shadow-inner">{selectedMonth}</span>
                                        </div>
                                        
                                        {(!isBarber) && (
                                            <div className="mb-8 bg-gradient-to-br from-white/10 to-transparent p-5 rounded-2xl border border-white/5 relative overflow-hidden">
                                                <div className="absolute -right-4 -top-4 w-24 h-24 bg-brand-gold/20 rounded-full blur-2xl"></div>
                                                <p className="text-white/50 text-xs font-bold uppercase tracking-wider mb-1 relative z-10">Celková tržba Salonu</p>
                                                <p className="text-4xl font-extrabold text-brand-gold mb-4 relative z-10">{totals.total.toLocaleString()} <span className="text-xl text-brand-gold/60">Kč</span></p>
                                                
                                                <div className="space-y-2.5 relative z-10">
                                                    <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">Hotovost</span><span className="font-bold">{totals.cash.toLocaleString()} Kč</span></div>
                                                    <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">QR platby</span><span className="font-bold">{totals.qr.toLocaleString()} Kč</span></div>
                                                    <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">Poukazy</span><span className="font-bold">{totals.voucher.toLocaleString()} Kč</span></div>
                                                    <div className="flex justify-between items-center pt-3 border-t border-white/10 mt-2"><span className="text-white/50 font-bold text-xs uppercase tracking-wider">Počet služeb celkem</span><span className="font-bold text-lg bg-brand-gold text-brand-dark px-2.5 py-0.5 rounded-lg">{totals.count}</span></div>
                                                </div>
                                            </div>
                                        )}

                                        <div>
                                            <h4 className="text-xs uppercase tracking-wider font-extrabold text-brand-gold mb-4">{isBarber ? 'TVOJE VÝSLEDKY' : 'ROZPAD NA KADEŘNÍKY'}</h4>
                                            
                                            <div className="space-y-3">
                                                {Object.entries(totals.byBarber).map(([barberName, data]) => {
                                                    if (isBarber && barberName !== activeRole) return null;
                                                    return (
                                                        <div key={barberName} className="bg-white/5 border border-white/10 rounded-2xl p-4 transition-all hover:bg-white/10">
                                                            <div className="flex justify-between items-center mb-3">
                                                                <span className="font-extrabold text-lg">{barberName}</span>
                                                                <span className="font-extrabold text-brand-gold text-lg">{data.total.toLocaleString()} <span className="text-sm opacity-50">Kč</span></span>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-y-2 gap-x-4 text-xs font-medium text-white/60">
                                                                <div className="flex justify-between"><span>Hotovost:</span><span className="text-white font-bold">{data.cash.toLocaleString()} Kč</span></div>
                                                                <div className="flex justify-between"><span>QR:</span><span className="text-white font-bold">{data.qr.toLocaleString()} Kč</span></div>
                                                                <div className="flex justify-between"><span>Poukaz:</span><span className="text-white font-bold">{data.voucher.toLocaleString()} Kč</span></div>
                                                                <div className="flex justify-between"><span>Služeb:</span><span className="text-brand-gold font-extrabold">{data.count}</span></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                                {Object.keys(totals.byBarber).length === 0 && <p className="text-white/40 text-sm italic text-center py-4">Zatím žádná data.</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* --- STREAMING_CHUNK:Rendering Floating Action Button --- */}
                    {!activeRole.includes('Účetní') && !(isMonthLocked && !isAdmin) && (
                        <button onClick={openModalForNew} className="md:hidden fixed bottom-6 right-6 w-16 h-16 bg-brand-gold text-white rounded-[1.5rem] shadow-glass shadow-brand-gold/40 flex items-center justify-center z-40 transform active:scale-95 transition-all">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    )}

                    {/* --- STREAMING_CHUNK:Rendering Add/Edit Modal --- */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-brand-dark/40 backdrop-blur-sm transition-opacity p-0 sm:p-4">
                            <div className="bg-white/90 backdrop-blur-2xl w-full max-w-lg rounded-t-[2rem] sm:rounded-[2rem] shadow-glass border-t sm:border border-white/50 overflow-hidden transform animate-slide-up max-h-[90vh] flex flex-col">
                                <div className="px-6 py-5 flex justify-between items-center border-b border-gray-200/50">
                                    <h3 className="text-xl font-extrabold text-brand-dark">{editingId ? 'Upravit zákazníka' : 'Nový zákazník'}</h3>
                                    <button onClick={closeModal} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-brand-gray hover:bg-gray-200 hover:text-brand-dark transition-colors font-bold">&times;</button>
                                </div>
                                
                                <div className="overflow-y-auto flex-1">
                                    <form id="recordForm" onSubmit={handleSaveRecord} className="p-6 space-y-5">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Datum *</label><input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none" /></div>
                                            <div><label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Čas *</label><input required type="time" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none" /></div>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Kadeřník</label>
                                            <select value={formData.barber} onChange={e => setFormData({...formData, barber: e.target.value})} className="w-full bg-gray-50/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none appearance-none">
                                                <option>Kadeřník 1</option><option>Kadeřník 2</option><option>Admin (Majitel)</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Služba *</label>
                                            <select value={formData.service} onChange={handleServiceChange} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none text-brand-dark appearance-none">
                                                {SERVICES.map(s => <option key={s.name} value={s.name}>{s.name} ({s.price} Kč)</option>)}
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Platba *</label>
                                            <div className="flex bg-gray-100/80 p-1.5 rounded-2xl border border-gray-200/50">
                                                {PAYMENTS.map(pay => (
                                                    <button key={pay} type="button" onClick={() => setFormData({...formData, payment: pay, voucherCode: ''})} className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${formData.payment === pay ? 'bg-white shadow-sm text-brand-dark' : 'text-brand-gray hover:text-brand-dark'}`}>{pay}</button>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        {formData.payment === 'POUKAZ' && (
                                            <div className="bg-purple-50/80 p-4 rounded-2xl border border-purple-100 animate-fade-in">
                                                <label className="block text-xs font-extrabold text-purple-800 uppercase mb-1.5 ml-1">Číslo poukazu *</label>
                                                <input required type="text" placeholder="Např. 15, VCH-123" value={formData.voucherCode} onChange={e => setFormData({...formData, voucherCode: e.target.value})} className="w-full bg-white border border-purple-200 rounded-xl shadow-sm focus:ring-2 focus:ring-purple-400 py-3 px-4 font-mono font-bold outline-none" />
                                            </div>
                                        )}
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Poznámka</label>
                                            <input type="text" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} placeholder="Volitelné..." className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-medium outline-none" />
                                        </div>
                                        
                                        {formError && (
                                            <div className="bg-red-50 text-red-700 p-3 rounded-lg border border-red-200 text-sm font-bold animate-fade-in">
                                                {formError}
                                            </div>
                                        )}
                                    </form>
                                </div>
                                
                                <div className="p-4 sm:p-6 bg-gray-50/80 border-t border-gray-200/50 flex gap-3">
                                    <button type="button" onClick={closeModal} className="flex-1 py-3.5 bg-white border border-gray-200 text-brand-dark rounded-xl font-bold shadow-sm hover:bg-gray-50 transition-colors">Zrušit</button>
                                    <button type="submit" form="recordForm" className="flex-1 py-3.5 bg-brand-gold text-white rounded-xl font-bold shadow-lg shadow-brand-gold/30 hover:bg-[#a68051] transition-all active:scale-95">{editingId ? 'Uložit úpravy' : 'Přidat zákazníka'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
