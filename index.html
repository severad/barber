<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jebley Barber Systém</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#b9925f',
                            gray: '#90908f',
                            dark: '#150d07',
                            brown: '#46342b',
                            light: '#f4ece4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(21, 13, 7, 0.05)',
                        'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    
    <style>
        body { 
            background-color: #f4ece4; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #90908f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b9925f; }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .bg-blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; border-radius: 50%; background: #b9925f; opacity: 0.15; filter: blur(100px); z-index: -1; pointer-events: none; }
        .bg-blob-2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vw; border-radius: 50%; background: #46342b; opacity: 0.1; filter: blur(120px); z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="text-brand-dark antialiased selection:bg-brand-gold selection:text-white">
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBf8IfMax0l5uvl9VdertYcK5ruVPBSvuE",
            authDomain: "barber-tabulky.firebaseapp.com",
            projectId: "barber-tabulky",
            storageBucket: "barber-tabulky.firebasestorage.app",
            messagingSenderId: "165152546039",
            appId: "1:165152546039:web:19b8a86e8e215c883cc7f2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const SERVICES = [
            { name: 'Klasický střih', price: 520 },
            { name: 'Střih strojkem', price: 470 },
            { name: 'Klasický střih a úprava vousů hot towel', price: 995 },
            { name: 'Klasický střih a úprava vousů strojkem', price: 950 },
            { name: 'Úprava vousů metodou hot towel', price: 490 },
            { name: 'Úprava vousů pouze strojkem', price: 460 },
            { name: 'Střih junior (do 8 let)', price: 420 },
            { name: 'Tradiční holení', price: 520 },
            { name: 'Holení hlavy', price: 520 },
            { name: 'Střih dlouhých vlasů', price: 895 },
            { name: 'Střih strojkem a úprava vousů strojkem', price: 900 },
            { name: 'Střih strojkem a úprava vousů hot towel', price: 965 },
            { name: 'Depilace chloupků z nosu a uší', price: 100 },
            { name: 'Barvení vousů', price: 550 },
            { name: 'Černá maska', price: 150 },
            { name: 'Barvení kontur', price: 300 },
            { name: 'Kompletní úprava', price: 1695 }
        ];

        const PAYMENTS = ['HOTOVOST', 'QR', 'POUKAZ'];

        const getDefaultDateTime = () => {
            const now = new Date();
            const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const roundedMinutes = Math.floor(now.getMinutes() / 15) * 15;
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(roundedMinutes).padStart(2, '0')}`;
            return { date, time };
        };

        const determineRole = (email) => {
            if (!email) return '';
            const lowerEmail = email.toLowerCase();
            if (lowerEmail.includes('admin')) return 'Admin (Majitel)';
            if (lowerEmail.includes('barber1') || lowerEmail.includes('kadernik1')) return 'Kadeřník 1';
            if (lowerEmail.includes('barber2') || lowerEmail.includes('kadernik2')) return 'Kadeřník 2';
            return 'Kadeřník 1'; 
        };

        // --- Komponenta pro poznámky kadeřníků a admina ---
        const NotesEditor = ({ barberName, selectedMonth, monthNotes, activeRole, isAdmin }) => {
            const docId = `${selectedMonth}_${barberName.replace(/\s+/g, '')}`;
            const serverNotes = monthNotes[docId] || {};
            
            const [publicNote, setPublicNote] = useState(serverNotes.public || '');
            const [secretNote, setSecretNote] = useState(serverNotes.secret || '');
            
            useEffect(() => {
                setPublicNote(serverNotes.public || '');
                setSecretNote(serverNotes.secret || '');
            }, [serverNotes]);

            const handleSave = async (type, content) => {
                await setDoc(doc(db, 'barber_month_notes', docId), {
                    [type]: content
                }, { merge: true });
            };

            return (
                <div className="flex flex-col sm:flex-row gap-4 mb-4 bg-white/40 p-4 rounded-xl border border-white/60">
                    <div className="flex-1">
                        <label className="block text-xs font-bold text-brand-gray uppercase mb-1">Měsíční poznámky (nápoje, přípravky)</label>
                        <textarea 
                            value={publicNote} 
                            onChange={(e) => setPublicNote(e.target.value)}
                            onBlur={(e) => handleSave('public', e.target.value)}
                            disabled={!isAdmin && activeRole !== barberName}
                            className="w-full bg-white rounded-lg p-3 text-sm border border-gray-200 outline-none focus:ring-2 focus:ring-brand-gold min-h-[100px] resize-y"
                            placeholder="Zde si evidujte prodané nápoje, přípravky atd..."
                        />
                    </div>
                    {isAdmin && (
                        <div className="flex-1">
                            <label className="block text-xs font-bold text-brand-gold uppercase mb-1 flex items-center gap-1"><span>🔒</span> Tajná poznámka kadeřníka</label>
                            <textarea 
                                value={secretNote} 
                                onChange={(e) => setSecretNote(e.target.value)}
                                onBlur={(e) => handleSave('secret', e.target.value)}
                                className="w-full bg-brand-gold/5 rounded-lg p-3 text-sm border border-brand-gold/30 outline-none focus:ring-2 focus:ring-brand-gold min-h-[100px] resize-y placeholder-brand-gold/50"
                                placeholder="Vaše tajná poznámka k tomuto kadeřníkovi pro tento měsíc..."
                            />
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [records, setRecords] = useState([]);
            const [settings, setSettings] = useState({});
            const [monthNotes, setMonthNotes] = useState({});
            const [activeRole, setActiveRole] = useState('');
            
            const today = new Date();
            const currentMonthStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const [selectedMonth, setSelectedMonth] = useState(currentMonthStr);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            
            const [formData, setFormData] = useState({
                date: '', time: '', service: SERVICES[0].name, price: SERVICES[0].price, 
                payment: PAYMENTS[0], voucherCode: '', notes: '', barber: 'Kadeřník 1'
            });

            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser && !currentUser.isAnonymous) {
                        setUser(currentUser);
                        setActiveRole(determineRole(currentUser.email));
                    } else {
                        setUser(null);
                        setActiveRole('');
                    }
                    setIsCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const recordsRef = collection(db, 'barber_records');
                const unsubRecords = onSnapshot(recordsRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => new Date(`${b.date}T${b.time}`) - new Date(`${a.date}T${a.time}`));
                    setRecords(data);
                });
                const settingsRef = collection(db, 'barber_settings');
                const unsubSettings = onSnapshot(settingsRef, (snapshot) => {
                    const data = {};
                    snapshot.docs.forEach(doc => { data[doc.id] = doc.data(); });
                    setSettings(data);
                });
                const notesRef = collection(db, 'barber_month_notes');
                const unsubNotes = onSnapshot(notesRef, (snapshot) => {
                    const data = {};
                    snapshot.docs.forEach(doc => { data[doc.id] = doc.data(); });
                    setMonthNotes(data);
                });
                return () => { unsubRecords(); unsubSettings(); unsubNotes(); };
            }, [user]);

            const isBarber = activeRole.includes('Kadeřník');
            const isAdmin = activeRole === 'Admin (Majitel)';
            const isMonthLocked = settings[selectedMonth]?.locked === true;

            useEffect(() => {
                if (isBarber && selectedMonth !== currentMonthStr) setSelectedMonth(currentMonthStr);
            }, [isBarber, selectedMonth, currentMonthStr]);

            const handleFirebaseLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    await signInWithEmailAndPassword(auth, emailInput, passwordInput);
                } catch (error) {
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        setLoginError('Špatný e-mail nebo heslo!');
                    } else if (error.code === 'auth/invalid-email') {
                         setLoginError('Neplatný formát e-mailu!');
                    } else {
                        setLoginError('Došlo k chybě při přihlašování.');
                    }
                }
            };

            const handleLogout = () => {
                signOut(auth).catch(error => console.error("Chyba při odhlašování", error));
            };

            const filteredRecords = useMemo(() => {
                return records.filter(record => record.date.substring(0, 7) === selectedMonth);
            }, [records, selectedMonth]);

            const recordsByBarber = useMemo(() => {
                const grouped = {};
                filteredRecords.forEach(r => {
                    const barber = r.barber || 'Neznámý';
                    if (!grouped[barber]) grouped[barber] = [];
                    grouped[barber].push(r);
                });
                return grouped;
            }, [filteredRecords]);

            const totals = useMemo(() => {
                const result = { total: 0, cash: 0, qr: 0, voucher: 0, count: 0, byBarber: {} };
                filteredRecords.forEach(curr => {
                    const price = Number(curr.price) || 0;
                    const barber = curr.barber || 'Neznámý';
                    
                    result.total += price;
                    result.count += 1;
                    if (curr.payment === 'HOTOVOST') result.cash += price;
                    if (curr.payment === 'QR') result.qr += price;
                    if (curr.payment === 'POUKAZ') result.voucher += price;

                    if (!result.byBarber[barber]) {
                        result.byBarber[barber] = { total: 0, cash: 0, qr: 0, voucher: 0, count: 0 };
                    }
                    result.byBarber[barber].total += price;
                    result.byBarber[barber].count += 1;
                    if (curr.payment === 'HOTOVOST') result.byBarber[barber].cash += price;
                    if (curr.payment === 'QR') result.byBarber[barber].qr += price;
                    if (curr.payment === 'POUKAZ') result.byBarber[barber].voucher += price;
                });
                return result;
            }, [filteredRecords]);

            // Dynamicky zjistíme všechny kadeřníky, aby se zobrazili i ti, co ještě nemají v měsíci služby
            const baseBarbers = ['Kadeřník 1', 'Kadeřník 2'];
            const allBarbers = Array.from(new Set([...baseBarbers, ...Object.keys(recordsByBarber)])).sort();
            const visibleBarbers = isBarber ? allBarbers.filter(b => b === activeRole) : allBarbers;

            const openModalForNew = () => {
                const dt = getDefaultDateTime();
                setFormData({
                    date: dt.date, time: dt.time, service: SERVICES[0].name, price: SERVICES[0].price, 
                    payment: PAYMENTS[0], voucherCode: '', notes: '', barber: activeRole.includes('Kadeřník') ? activeRole : 'Kadeřník 1'
                });
                setEditingId(null);
                setIsModalOpen(true);
            };

            const openEditModal = (record) => {
                setFormData({ ...record, voucherCode: record.voucherCode || '', notes: record.notes || '' });
                setEditingId(record.id);
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingId(null);
            };

            const handleServiceChange = (e) => {
                const serviceName = e.target.value;
                const service = SERVICES.find(s => s.name === serviceName);
                setFormData({ ...formData, service: serviceName, price: service.price });
            };

            const handleSaveRecord = async (e) => {
                e.preventDefault();
                if (!user) return;
                
                const recordMonth = formData.date.substring(0, 7);
                if (settings[recordMonth]?.locked === true && !isAdmin) {
                    alert("Tento měsíc je uzamčen. Nelze v něm provádět změny.");
                    return;
                }

                if (formData.payment === 'POUKAZ' && !formData.voucherCode.trim()) {
                    alert("Při platbě poukazem je nutné zadat číslo poukazu!"); return;
                }
                try {
                    if (editingId) {
                        await updateDoc(doc(db, 'barber_records', editingId), { ...formData, updatedBy: activeRole, updatedAt: new Date().toISOString() });
                    } else {
                        await addDoc(collection(db, 'barber_records'), { ...formData, createdAt: new Date().toISOString(), addedBy: activeRole });
                    }
                    setIsModalOpen(false);
                } catch (error) { console.error(error); }
            };

            const handleDelete = async (id) => {
                if (!user) return;
                
                const recordToDelete = records.find(r => r.id === id);
                if (recordToDelete) {
                     const recordMonth = recordToDelete.date.substring(0, 7);
                     if (settings[recordMonth]?.locked === true && !isAdmin) {
                         alert("Záznam spadá do uzamčeného měsíce. Nelze jej smazat.");
                         return;
                     }
                }

                if (window.confirm("Opravdu smazat tento záznam? Tuto akci nelze vrátit.")) {
                    if (recordToDelete) {
                        try {
                            await addDoc(collection(db, 'deleted_records'), {
                                ...recordToDelete,
                                deletedAt: new Date().toISOString(),
                                deletedBy: activeRole,
                                originalId: id
                            });
                            await deleteDoc(doc(db, 'barber_records', id));
                        } catch (error) { 
                            console.error("Chyba při mazání:", error); 
                        }
                    }
                }
            };

            const toggleLockMonth = async () => {
                if (!user || !isAdmin) return;
                await setDoc(doc(db, 'barber_settings', selectedMonth), { locked: !isMonthLocked }, { merge: true });
            };

            const exportToCSV = () => {
                const headers = ['Datum', 'Čas', 'Kadeřník', 'Služba', 'Platba', 'Cena (Kč)', 'Poznámka ke službě'];
                const rows = filteredRecords.map(r => [
                    formatDate(r.date),
                    r.time,
                    r.barber,
                    r.service,
                    r.payment,
                    r.price,
                    r.notes ? `"${r.notes.replace(/"/g, '""')}"` : ''
                ]);
                const csvContent = "data:text/csv;charset=utf-8,\uFEFF"
                    + [headers.join(';')].concat(rows.map(e => e.join(';'))).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Trzby_Jebley_${selectedMonth}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const formatDate = (dateString) => {
                if (!dateString) return '';
                const [year, month, day] = dateString.split('-');
                return `${day}.${month}.${year}`;
            };

            if (isCheckingAuth) {
                return <div className="min-h-screen flex items-center justify-center text-brand-dark font-bold">Načítání zabezpečení...</div>;
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
                        <div className="max-w-md w-full space-y-8 bg-white/70 backdrop-blur-xl p-8 rounded-[2rem] shadow-glass border border-white/50 animate-fade-in z-10">
                            <div className="text-center flex flex-col items-center">
                                <div className="w-20 h-20 bg-brand-dark rounded-3xl flex items-center justify-center mb-6 shadow-xl transform rotate-3">
                                    <img src="https://jebley-barber.cz/images/logo.png" alt="Jebley Barber" className="h-12 object-contain -rotate-3" />
                                </div>
                                <h2 className="text-3xl font-extrabold text-brand-dark tracking-tight">Vstup do systému</h2>
                                <p className="mt-2 text-brand-gray font-medium">Zabezpečený přístup</p>
                            </div>
                            <form className="mt-8 space-y-6" onSubmit={handleFirebaseLogin}>
                                <div className="space-y-4">
                                    <div className="animate-fade-in">
                                        <label className="block text-sm font-bold text-brand-dark/70 mb-2 ml-1">E-mail</label>
                                        <input type="email" required className="w-full bg-white/60 border border-white/80 rounded-2xl shadow-sm py-3.5 px-4 focus:ring-2 focus:ring-brand-gold outline-none transition-all backdrop-blur-sm" placeholder="např. admin@jebley.cz" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} />
                                    </div>
                                    <div className="animate-fade-in">
                                        <label className="block text-sm font-bold text-brand-dark/70 mb-2 ml-1">Heslo</label>
                                        <input type="password" required className="w-full bg-white/60 border border-white/80 rounded-2xl shadow-sm py-3.5 px-4 focus:ring-2 focus:ring-brand-gold text-center text-2xl tracking-widest outline-none transition-all backdrop-blur-sm" placeholder="••••••••" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} />
                                    </div>
                                </div>
                                {loginError && <p className="text-red-500 text-sm text-center font-bold bg-red-50/80 py-3 rounded-xl border border-red-100">{loginError}</p>}
                                <button type="submit" className="w-full flex justify-center py-4 px-4 rounded-2xl text-lg font-bold text-white bg-brand-gold hover:bg-[#a68051] transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                                    Přihlásit se
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 md:pb-12 animate-fade-in relative">
                    <header className="sticky top-0 z-30 bg-white/60 backdrop-blur-xl border-b border-white/40 shadow-sm">
                        <div className="max-w-[1600px] mx-auto px-4 py-3 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-dark p-2 rounded-xl"><img src="https://jebley-barber.cz/images/logo.png" alt="Logo" className="h-6" /></div>
                                <h1 className="text-xl font-extrabold tracking-tight hidden sm:block">Barber Systém</h1>
                            </div>
                            <div className="flex items-center gap-3 bg-white/50 backdrop-blur-md border border-white/60 py-1.5 px-4 rounded-full shadow-sm">
                                <span className="text-xs font-bold text-brand-gray uppercase hidden md:block">Profil:</span>
                                <span className="text-brand-gold font-bold text-sm">{activeRole}</span>
                                <div className="h-4 w-px bg-brand-gray/30 mx-1"></div>
                                <button onClick={handleLogout} className="text-sm font-semibold text-brand-gray hover:text-brand-dark transition-colors">Odhlásit</button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-[1600px] mx-auto px-4 mt-6 sm:px-6 lg:px-8 flex flex-col xl:flex-row gap-6">
                        
                        <div className="flex-1 flex flex-col gap-6">
                            
                            <div className="bg-white/70 backdrop-blur-xl border border-white/50 p-5 rounded-[2rem] shadow-glass flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div className="flex flex-wrap items-center gap-4 w-full sm:w-auto">
                                    <div className="flex-1 sm:flex-none">
                                        <label className="block text-xs font-bold text-brand-gray uppercase mb-1 ml-1">Měsíc</label>
                                        <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} disabled={isBarber}
                                            className={`w-full sm:w-auto rounded-xl py-2.5 px-4 text-sm font-bold outline-none transition-all ${isBarber ? 'bg-gray-100/50 text-brand-gray cursor-not-allowed' : 'bg-white shadow-sm border border-white/80 focus:ring-2 focus:ring-brand-gold'}`} />
                                    </div>
                                    {isAdmin && (
                                        <div className="flex gap-2 mt-5">
                                            <button onClick={toggleLockMonth} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm flex items-center gap-2 ${isMonthLocked ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`}>
                                                {isMonthLocked ? '🔒 Zamčeno' : '🔓 Odemčeno'}
                                            </button>
                                            <button onClick={exportToCSV} className="px-4 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-blue-50 text-blue-700 border border-blue-100 flex items-center gap-2 hover:bg-blue-100">
                                                📥 Exportovat tržby (CSV)
                                            </button>
                                        </div>
                                    )}
                                </div>
                                
                                {!(isMonthLocked && !isAdmin) && (
                                    <button onClick={openModalForNew} className="hidden md:flex bg-brand-gold text-white px-6 py-3 rounded-2xl font-bold shadow-lg shadow-brand-gold/30 hover:bg-[#a68051] transition-all transform hover:-translate-y-0.5 items-center gap-2">
                                        <span className="text-xl leading-none">+</span> Nový zákazník
                                    </button>
                                )}
                            </div>

                            {isMonthLocked && (
                                <div className="bg-red-50/80 backdrop-blur-md border border-red-100 p-4 rounded-[1.5rem] flex items-center gap-4 shadow-sm animate-slide-up">
                                    <div className="text-3xl opacity-80">🔒</div>
                                    <div>
                                        <h2 className="text-red-800 font-extrabold text-lg">Měsíc je uzavřen</h2>
                                        <p className="text-red-600 font-medium text-sm">Záznamy lze pouze prohlížet. Pro úpravy kontaktujte admina.</p>
                                    </div>
                                </div>
                            )}

                            {/* MOBILNÍ ZOBRAZENÍ */}
                            <div className="md:hidden flex flex-col gap-6">
                                {visibleBarbers.map(barberName => {
                                    const barberRecords = recordsByBarber[barberName] || [];
                                    return (
                                        <div key={barberName} className="flex flex-col gap-4">
                                            <h3 className={`font-extrabold text-lg px-2 border-b-2 pb-1 inline-block self-start ${barberName === 'Kadeřník 1' ? 'text-brand-gold border-brand-gold/30' : 'text-brand-brown border-brand-brown/30'}`}>
                                                {barberName}
                                            </h3>
                                            
                                            {/* Poznámky kadeřníka / Tajná Admin */}
                                            <NotesEditor 
                                                barberName={barberName} selectedMonth={selectedMonth} 
                                                monthNotes={monthNotes} activeRole={activeRole} isAdmin={isAdmin} 
                                            />

                                            {barberRecords.length === 0 ? (
                                                <div className="text-center p-4 bg-white/50 rounded-xl border border-white/50 text-brand-gray font-medium">Zatím žádné služby v tomto měsíci.</div>
                                            ) : (
                                                barberRecords.map(record => (
                                                    <div key={record.id} className="bg-white/80 backdrop-blur-xl border border-white/80 p-5 rounded-[1.5rem] shadow-sm flex flex-col gap-3 animate-slide-up">
                                                        <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                                                            <div className="flex items-center gap-2">
                                                                <div className="bg-brand-gold/10 text-brand-gold px-2.5 py-1 rounded-lg text-sm font-extrabold">{formatDate(record.date)}</div>
                                                                <div className="text-brand-gray font-bold text-sm">{record.time}</div>
                                                            </div>
                                                            <div className="text-lg font-extrabold text-brand-dark">{record.price} Kč</div>
                                                        </div>
                                                        
                                                        <div>
                                                            <div className="font-bold text-brand-dark">{record.service}</div>
                                                        </div>
                                                        
                                                        <div className="flex justify-between items-end pt-2">
                                                            <div>
                                                                <span className={`px-3 py-1 inline-flex text-xs font-extrabold rounded-full ${record.payment === 'HOTOVOST' ? 'bg-red-50 text-red-600' : ''} ${record.payment === 'QR' ? 'bg-green-50 text-green-600' : ''} ${record.payment === 'POUKAZ' ? 'bg-purple-50 text-purple-600' : ''}`}>
                                                                    {record.payment} {record.payment === 'POUKAZ' && `(#${record.voucherCode})`}
                                                                </span>
                                                                {record.notes && <div className="text-xs text-brand-gray mt-2 italic">"{record.notes}"</div>}
                                                            </div>
                                                            
                                                            {(!isMonthLocked || isAdmin) && (
                                                                <div className="flex gap-2">
                                                                    <button onClick={() => openEditModal(record)} className="text-brand-gold bg-brand-gold/10 px-3 py-1.5 rounded-xl text-sm font-bold">Upravit</button>
                                                                    {isAdmin && <button onClick={() => handleDelete(record.id)} className="text-red-500 bg-red-50 px-3 py-1.5 rounded-xl text-sm font-bold">Smazat</button>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* DESKTOP ZOBRAZENÍ */}
                            <div className="hidden md:flex flex-col gap-8">
                                {visibleBarbers.map(barberName => {
                                    const barberRecords = recordsByBarber[barberName] || [];
                                    return (
                                        <div key={barberName} className="bg-white/70 backdrop-blur-xl border border-white/50 rounded-[2rem] shadow-glass overflow-hidden animate-slide-up">
                                            <div className={`px-6 py-4 border-b ${barberName === 'Kadeřník 1' ? 'bg-brand-gold/10 border-brand-gold/30' : 'bg-brand-brown/10 border-brand-brown/30'}`}>
                                                <h3 className={`font-extrabold text-lg ${barberName === 'Kadeřník 1' ? 'text-brand-gold' : 'text-brand-brown'}`}>{barberName}</h3>
                                            </div>
                                            
                                            <div className="px-6 py-4 border-b border-white/50">
                                                <NotesEditor 
                                                    barberName={barberName} selectedMonth={selectedMonth} 
                                                    monthNotes={monthNotes} activeRole={activeRole} isAdmin={isAdmin} 
                                                />
                                            </div>

                                            {barberRecords.length === 0 ? (
                                                <div className="p-8 text-center text-brand-gray font-medium">V tomto měsíci nejsou zatím zapsány žádné služby.</div>
                                            ) : (
                                                <table className="min-w-full text-left border-collapse">
                                                    <thead className="bg-white/40 border-b border-white/50 backdrop-blur-md">
                                                        <tr>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider">Datum a Čas</th>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider">Služba</th>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider">Platba</th>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider text-right">Cena</th>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider">Poznámka</th>
                                                            <th className="px-6 py-4 text-xs font-extrabold text-brand-gray uppercase tracking-wider text-right">Akce</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-100/50">
                                                        {barberRecords.map((record) => (
                                                            <tr key={record.id} className="hover:bg-white/50 transition-colors">
                                                                <td className="px-6 py-4 whitespace-nowrap text-sm"><span className="font-bold text-brand-dark">{formatDate(record.date)}</span> <span className="text-brand-gray font-medium ml-2">{record.time}</span></td>
                                                                <td className="px-6 py-4 text-sm font-semibold text-brand-dark max-w-[250px] leading-snug">{record.service}</td>
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <span className={`px-3 py-1 inline-flex text-xs font-extrabold rounded-full ${record.payment === 'HOTOVOST' ? 'bg-red-50 text-red-600 border border-red-100' : ''} ${record.payment === 'QR' ? 'bg-green-50 text-green-600 border border-green-100' : ''} ${record.payment === 'POUKAZ' ? 'bg-purple-50 text-purple-600 border border-purple-100' : ''}`}>
                                                                        {record.payment}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-extrabold text-brand-dark text-right text-base">{record.price} Kč</td>
                                                                <td className="px-6 py-4 text-sm text-brand-gray max-w-[200px]">
                                                                    {record.payment === 'POUKAZ' && <span className="block text-xs font-bold text-purple-600 mb-0.5">#{record.voucherCode}</span>}
                                                                    <span className="truncate block">{record.notes}</span>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap text-right">
                                                                    {(!isMonthLocked || isAdmin) && (
                                                                        <div className="flex justify-end gap-2">
                                                                            <button onClick={() => openEditModal(record)} className="text-brand-gold bg-brand-gold/10 hover:bg-brand-gold/20 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">Upravit</button>
                                                                            {isAdmin && <button onClick={() => handleDelete(record.id)} className="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">Smazat</button>}
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Pravý panel: Souhrn */}
                        <div className="w-full xl:w-[380px] shrink-0">
                            <div className="bg-brand-dark/90 backdrop-blur-2xl border border-white/10 rounded-[2rem] shadow-glass-dark overflow-hidden sticky top-24 text-white p-6">
                                <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                                    <h3 className="font-extrabold text-xl tracking-tight">Souhrn měsíce</h3>
                                    <span className="bg-white/10 px-3 py-1 rounded-full text-xs font-bold text-brand-gold">{selectedMonth}</span>
                                </div>
                                
                                {(!isBarber) && (
                                    <div className="mb-8 bg-gradient-to-br from-white/10 to-transparent p-5 rounded-2xl border border-white/5">
                                        <p className="text-white/50 text-xs font-bold uppercase tracking-wider mb-1">Celková tržba Salonu</p>
                                        <p className="text-4xl font-extrabold text-brand-gold mb-4">{totals.total.toLocaleString()} <span className="text-xl text-brand-gold/60">Kč</span></p>
                                        
                                        <div className="space-y-2.5">
                                            <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">Hotovost</span><span className="font-bold">{totals.cash.toLocaleString()} Kč</span></div>
                                            <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">QR platby</span><span className="font-bold">{totals.qr.toLocaleString()} Kč</span></div>
                                            <div className="flex justify-between items-center text-sm font-medium"><span className="text-white/70">Poukazy</span><span className="font-bold">{totals.voucher.toLocaleString()} Kč</span></div>
                                            <div className="flex justify-between items-center pt-3 border-t border-white/10 mt-2"><span className="text-white/50 font-bold text-xs uppercase tracking-wider">Počet služeb celkem</span><span className="font-bold text-lg bg-brand-gold text-brand-dark px-2.5 py-0.5 rounded-lg">{totals.count}</span></div>
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <h4 className="text-xs uppercase tracking-wider font-extrabold text-brand-gold mb-4">{isBarber ? 'TVOJE VÝSLEDKY' : 'ROZPAD NA KADEŘNÍKY'}</h4>
                                    
                                    <div className="space-y-3">
                                        {Object.entries(totals.byBarber).map(([barberName, data]) => {
                                            if (isBarber && barberName !== activeRole) return null;
                                            return (
                                                <div key={barberName} className="bg-white/5 border border-white/10 rounded-2xl p-4 transition-all hover:bg-white/10">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <span className="font-extrabold text-lg">{barberName}</span>
                                                        <span className="font-extrabold text-brand-gold text-lg">{data.total.toLocaleString()} Kč</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-y-2 gap-x-4 text-xs font-medium text-white/60">
                                                        <div className="flex justify-between"><span>Hotovost:</span><span className="text-white font-bold">{data.cash.toLocaleString()} Kč</span></div>
                                                        <div className="flex justify-between"><span>QR:</span><span className="text-white font-bold">{data.qr.toLocaleString()} Kč</span></div>
                                                        <div className="flex justify-between"><span>Poukaz:</span><span className="text-white font-bold">{data.voucher.toLocaleString()} Kč</span></div>
                                                        <div className="flex justify-between"><span>Služeb:</span><span className="text-brand-gold font-extrabold">{data.count}</span></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {Object.keys(totals.byBarber).length === 0 && <p className="text-white/40 text-sm italic text-center py-4">Zatím žádná data.</p>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {!(isMonthLocked && !isAdmin) && (
                        <button onClick={openModalForNew} className="md:hidden fixed bottom-6 right-6 w-16 h-16 bg-brand-gold text-white rounded-[1.5rem] shadow-glass shadow-brand-gold/40 flex items-center justify-center z-40 transform active:scale-95 transition-all">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    )}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-brand-dark/40 backdrop-blur-sm transition-opacity p-0 sm:p-4">
                            <div className="bg-white/90 backdrop-blur-2xl w-full max-w-lg rounded-t-[2rem] sm:rounded-[2rem] shadow-glass border-t sm:border border-white/50 overflow-hidden transform animate-slide-up max-h-[90vh] flex flex-col">
                                <div className="px-6 py-5 flex justify-between items-center border-b border-gray-200/50">
                                    <h3 className="text-xl font-extrabold text-brand-dark">{editingId ? 'Upravit zákazníka' : 'Nový zákazník'}</h3>
                                    <button onClick={closeModal} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-brand-gray hover:bg-gray-200 hover:text-brand-dark transition-colors font-bold">&times;</button>
                                </div>
                                
                                <div className="overflow-y-auto flex-1">
                                    <form id="recordForm" onSubmit={handleSaveRecord} className="p-6 space-y-5">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Datum *</label>
                                                <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Čas *</label>
                                                <input required type="time" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none" />
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Kadeřník</label>
                                            <select value={formData.barber} onChange={e => setFormData({...formData, barber: e.target.value})} className="w-full bg-gray-50/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none appearance-none">
                                                <option>Kadeřník 1</option><option>Kadeřník 2</option><option>Admin (Majitel)</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Služba *</label>
                                            <select value={formData.service} onChange={handleServiceChange} className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-bold outline-none text-brand-dark appearance-none">
                                                {SERVICES.map(s => <option key={s.name} value={s.name}>{s.name} ({s.price} Kč)</option>)}
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Platba *</label>
                                            <div className="flex bg-gray-100/80 p-1.5 rounded-2xl border border-gray-200/50">
                                                {PAYMENTS.map(pay => (
                                                    <button key={pay} type="button" onClick={() => setFormData({...formData, payment: pay, voucherCode: ''})} className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${formData.payment === pay ? 'bg-white shadow-sm text-brand-dark' : 'text-brand-gray hover:text-brand-dark'}`}>{pay}</button>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        {formData.payment === 'POUKAZ' && (
                                            <div className="bg-purple-50/80 p-4 rounded-2xl border border-purple-100 animate-fade-in">
                                                <label className="block text-xs font-extrabold text-purple-800 uppercase mb-1.5 ml-1">Číslo poukazu *</label>
                                                <input required type="text" placeholder="Např. 15, VCH-123" value={formData.voucherCode} onChange={e => setFormData({...formData, voucherCode: e.target.value})} className="w-full bg-white border border-purple-200 rounded-xl shadow-sm focus:ring-2 focus:ring-purple-400 py-3 px-4 font-mono font-bold outline-none" />
                                            </div>
                                        )}
                                        
                                        <div>
                                            <label className="block text-xs font-extrabold text-brand-gray uppercase mb-1.5 ml-1">Poznámka ke službě</label>
                                            <input type="text" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} placeholder="Volitelné..." className="w-full bg-white/50 border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-gold py-3 px-4 font-medium outline-none" />
                                        </div>
                                    </form>
                                </div>
                                
                                <div className="p-4 sm:p-6 bg-gray-50/80 border-t border-gray-200/50 flex gap-3">
                                    <button type="button" onClick={closeModal} className="flex-1 py-3.5 bg-white border border-gray-200 text-brand-dark rounded-xl font-bold shadow-sm hover:bg-gray-50 transition-colors">Zrušit</button>
                                    <button type="submit" form="recordForm" className="flex-1 py-3.5 bg-brand-gold text-white rounded-xl font-bold shadow-lg shadow-brand-gold/30 hover:bg-[#a68051] transition-all active:scale-95">{editingId ? 'Uložit úpravy' : 'Přidat zákazníka'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
